# Render blueprint: one web service that builds the React app and serves it
# from Flask, so the deployment is a single URL.
#
# Set GROQ_API_KEY in the Render dashboard (Environment -> Secret). Everything
# else has a working default.

services:
  - type: web
    name: skillmock
    runtime: python
    plan: free
    region: singapore
    buildCommand: |
      set -e
      cd frontend && npm ci --no-audit --no-fund && npm run build && cd ..
      rm -rf backend/static && cp -r frontend/build backend/static
      pip install -r backend/requirements.txt
      python -c "from fastembed import TextEmbedding; TextEmbedding('sentence-transformers/all-MiniLM-L6-v2')"
    startCommand: gunicorn --chdir backend -w 1 -k gthread --threads 4 -t 300 -b 0.0.0.0:$PORT app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DB_BACKEND
        value: sqlite
      - key: SQLITE_PATH
        value: /tmp/skillmock.db
      - key: EMBEDDING_BACKEND
        value: onnx
      - key: HF_HOME
        value: /opt/render/project/.cache/hf
      - key: FLASK_DEBUG
        value: "false"
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
